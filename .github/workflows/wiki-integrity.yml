name: Integritat de la Wiki

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests i auditories
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obri el repositori
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Proves adversarials documentals
        run: node --test tests/documental.test.mjs tests/porta-reflex.test.mjs tests/fortificacio.test.mjs tests/hooks-local.test.mjs tests/security-chain.test.mjs tests/verificador-scc.test.mjs tests/git-hooks.test.mjs

      - name: Valida documents del canvi
        env:
          SDP_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$SDP_BASE" ] && git cat-file -e "$SDP_BASE^{commit}" 2>/dev/null; then
            node tooling/gates/porta-documents.mjs --base "$SDP_BASE"
          else
            node tooling/gates/porta-documents.mjs --all
          fi

      - name: Comprova integritat de documentació i nomenclatures
        run: npm run gate

      - name: Linter i auditories d'estil
        run: npm run lint

      - name: Executa els tests unitaris
        run: npm run test
