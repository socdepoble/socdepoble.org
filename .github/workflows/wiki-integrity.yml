name: Integritat de la Wiki

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests i auditories
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obri el repositori
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Comprova integritat de documentació i nomenclatures
        run: npm run gate

      - name: Linter i auditories d'estil
        run: npm run lint

      - name: Executa els tests unitaris
        run: npm run test
