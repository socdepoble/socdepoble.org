name: Integritat de la Wiki

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests i auditories
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Obri el repositori
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: PHP per a les proves del plugin
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3

      - name: Proves completes (Node, WordPress i Vitest)
        run: npm run test:ci

      - name: Valida documents del canvi
        env:
          SDP_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$SDP_BASE" ] && git cat-file -e "$SDP_BASE^{commit}" 2>/dev/null; then
            node tooling/gates/porta-documents.mjs --base "$SDP_BASE"
          else
            node tooling/gates/porta-documents.mjs --all
          fi

      - name: Comprova integritat de documentació i nomenclatures
        run: npm run porta -- --nomes-portes

      - name: Linter i auditories d'estil
        run: npm run lint

