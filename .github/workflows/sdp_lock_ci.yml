name: Sóc de Poble - SDP-LOCK Gate
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  gate-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codi
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Instal·lar dependències
        run: npm ci
      - name: Verificar Integristat Arquitectònica (SDP-LOCK)
        run: npm run gate
